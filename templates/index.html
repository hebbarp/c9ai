{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <h2>Your Blocked Calendar Events</h2>
        <div id="events-container">
            <div class="text-center">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h5>Quick Actions</h5>
            </div>
            <div class="card-body">
                <a href="/block" class="btn btn-primary w-100 mb-2">Block New Time</a>
                <button onclick="loadEvents()" class="btn btn-outline-secondary w-100">Refresh Events</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function loadEvents() {
    const container = document.getElementById('events-container');
    container.innerHTML = '<div class="text-center"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>';
    
    fetch('/events')
        .then(response => response.json())
        .then(events => {
            if (events.length === 0) {
                container.innerHTML = '<div class="alert alert-info">No blocked events found. <a href="/block">Create your first one!</a></div>';
                return;
            }
            
            let html = '';
            events.forEach(event => {
                const startDate = new Date(event.start_time).toLocaleString();
                const endDate = new Date(event.end_time).toLocaleString();
                
                html += `
                <div class="card event-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">${event.title}</h6>
                        <button onclick="deleteEvent(${event.id})" class="btn btn-sm btn-outline-danger">Delete</button>
                    </div>
                    <div class="card-body">
                        <p><strong>Start:</strong> ${startDate}</p>
                        <p><strong>End:</strong> ${endDate}</p>
                        ${event.description ? `<p><strong>Description:</strong> ${event.description}</p>` : ''}
                        ${event.notification_email ? `<p><strong>Notification Email:</strong> ${event.notification_email}</p>` : ''}
                        <small class="text-muted">Created: ${new Date(event.created_at).toLocaleString()}</small>
                    </div>
                </div>
                `;
            });
            
            container.innerHTML = html;
        })
        .catch(error => {
            container.innerHTML = '<div class="alert alert-danger">Error loading events. Please try again.</div>';
            console.error('Error:', error);
        });
}

function deleteEvent(eventId) {
    if (confirm('Are you sure you want to delete this event?')) {
        fetch(`/delete/${eventId}`, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                loadEvents();
            } else {
                alert('Error deleting event');
            }
        })
        .catch(error => {
            alert('Error deleting event');
            console.error('Error:', error);
        });
    }
}

// Load events when page loads
document.addEventListener('DOMContentLoaded', loadEvents);
</script>
{% endblock %}
