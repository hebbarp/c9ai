<!DOCTYPE html><html>  <head>    <meta charset="UTF-8" />    <title>C9AI Unicode Editor</title>    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;700&display=swap" rel="stylesheet" /><style>body{font-family:Arial;margin:20px;background:lightblue}.container{max-width:800px;margin:0 auto}.editor{background:white;padding:20px;border-radius:5px}.toolbar{margin-bottom:10px}.btn{background:blue;color:white;border:none;padding:10px;margin:5px;cursor:pointer}.content{width:100%;min-height:200px;border:2px solid gray;padding:15px;font-size:16px}</style>  </head>  <body>    <div class="container">      <div class="editor">        <h1>C9AI Editor</h1>        <div class="toolbar">          <button onclick="save()">Save</button>          <button onclick="load()">Load</button>          <button onclick="ai()">AI</button>        </div><div class="content" contenteditable="true" id="editor">Welcome to C9AI Web Editor. Perfect Unicode rendering with live Squeak integration.</div><div id="status">Ready</div><div id="ai">AI responses here</div>      </div>    </div><script>
function save(){
  var t=document.getElementById("editor").innerText;
  fetch("/api/save",{method:"POST",body:JSON.stringify({content:t})});
  document.getElementById("status").innerText="Saved";
}
function load(){
  fetch("/api/content").then(function(r){return r.json()}).then(function(d){
    document.getElementById("editor").innerText=d.content;
    document.getElementById("status").innerText="Loaded";
  });
}
function ai(){
  var t=document.getElementById("editor").innerText;
  fetch("/api/ai-process",{method:"POST",body:JSON.stringify({content:t})}).then(function(r){return r.json()}).then(function(d){
    document.getElementById("ai").innerHTML="AI: "+d.response;
  });
}
</script>  </body></html>
