<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C9AI RFQ Analyzer - Executive Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #2d3748;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: #718096;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(45deg, #4299e1, #3182ce);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .drop-zone {
            border: 3px dashed #cbd5e0;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            background: #f7fafc;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: #4299e1;
            background: #ebf8ff;
            transform: translateY(-2px);
        }

        .drop-zone-content {
            pointer-events: none;
        }

        .drop-zone-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #4299e1;
        }

        .drop-zone h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #2d3748;
        }

        .drop-zone p {
            color: #718096;
            font-size: 1rem;
        }

        .file-input {
            display: none;
        }

        .parameters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .param-group {
            background: #f7fafc;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #4299e1;
        }

        .param-group label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .param-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .param-group input:focus {
            outline: none;
            border-color: #4299e1;
        }

        .analyze-btn {
            width: 100%;
            background: linear-gradient(45deg, #4299e1, #3182ce);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .analyze-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(66, 153, 225, 0.3);
        }

        .analyze-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results {
            background: #f7fafc;
            padding: 25px;
            border-radius: 12px;
            border-left: 4px solid #38b2ac;
            display: none;
        }

        .results h3 {
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .result-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .result-item .label {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 5px;
        }

        .result-item .value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d3748;
        }

        .phases {
            margin-top: 20px;
        }

        .phases h4 {
            margin-bottom: 15px;
            color: #2d3748;
        }

        .phase-item {
            background: white;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4299e1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fed7d7;
            border: 1px solid #fc8181;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .parameters {
                grid-template-columns: 1fr;
            }
            
            .container {
                margin: 10px;
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 RFQ Analyzer</h1>
            <p>AI-powered Request for Quotation analysis tool for business executives</p>
            <span class="badge">Executive Module</span>
        </div>

        <div class="error" id="error-message"></div>

        <div class="drop-zone" id="drop-zone">
            <div class="drop-zone-content">
                <div class="drop-zone-icon">📁</div>
                <h3>Drop RFQ Document Here</h3>
                <p>or click to select files • Supports TXT, PDF, DOCX, HTML, JSON</p>
            </div>
            <input type="file" class="file-input" id="file-input" accept=".txt,.pdf,.docx,.html,.json,.md">
        </div>

        <div class="parameters">
            <div class="param-group">
                <label for="hourly-rate">Hourly Rate ($)</label>
                <input type="number" id="hourly-rate" value="175" min="50" max="500">
            </div>
            <div class="param-group">
                <label for="margin-target">Target Margin (%)</label>
                <input type="number" id="margin-target" value="25" min="10" max="50">
            </div>
        </div>

        <button class="analyze-btn" id="analyze-btn" disabled>
            📊 Analyze RFQ Document
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing RFQ document... This may take a few moments.</p>
        </div>

        <div class="results" id="results">
            <h3>🎯 Analysis Results</h3>
            <div class="results-grid" id="results-grid">
                <!-- Results will be inserted here -->
            </div>
            <div class="phases" id="phases-container">
                <h4>📋 Project Phases</h4>
                <div id="phases-list">
                    <!-- Phases will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const analyzeBtn = document.getElementById('analyze-btn');
        const results = document.getElementById('results');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');

        let selectedFile = null;

        // Handle drag and drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', handleDragOver);
        dropZone.addEventListener('dragleave', handleDragLeave);
        dropZone.addEventListener('drop', handleDrop);
        fileInput.addEventListener('change', handleFileSelect);
        analyzeBtn.addEventListener('click', analyzeRFQ);

        function handleDragOver(e) {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        }

        function handleDragLeave() {
            dropZone.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                selectedFile = files[0];
                updateDropZoneText();
                analyzeBtn.disabled = false;
            }
        }

        function handleFileSelect(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                updateDropZoneText();
                analyzeBtn.disabled = false;
            }
        }

        function updateDropZoneText() {
            if (selectedFile) {
                const icon = dropZone.querySelector('.drop-zone-icon');
                const title = dropZone.querySelector('h3');
                const subtitle = dropZone.querySelector('p');
                
                icon.textContent = '✅';
                title.textContent = `Selected: ${selectedFile.name}`;
                subtitle.textContent = `Size: ${formatFileSize(selectedFile.size)} • Click to change`;
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        async function analyzeRFQ() {
            if (!selectedFile) {
                showError('Please select an RFQ document first.');
                return;
            }

            try {
                // Show loading state
                loading.style.display = 'block';
                results.style.display = 'none';
                analyzeBtn.disabled = true;

                // Read file content
                const fileContent = await readFileAsText(selectedFile);
                
                // Get parameters
                const hourlyRate = parseFloat(document.getElementById('hourly-rate').value);
                const marginTarget = parseFloat(document.getElementById('margin-target').value);

                // Simulate API call (in real implementation, this would call the C9AI backend)
                const analysisResult = await simulateRFQAnalysis(fileContent, hourlyRate, marginTarget);
                
                // Display results
                displayResults(analysisResult);
                
                loading.style.display = 'none';
                results.style.display = 'block';
                analyzeBtn.disabled = false;

            } catch (error) {
                console.error('Analysis error:', error);
                showError('Failed to analyze RFQ document. Please try again.');
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
            }
        }

        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(e);
                reader.readAsText(file);
            });
        }

        // Simulate RFQ analysis (in real implementation, this would call the backend API)
        async function simulateRFQAnalysis(content, hourlyRate, marginTarget) {
            // Simulate API delay
            await new Promise(resolve => setTimeout(resolve, 2000));

            // Simple analysis simulation based on content length and keywords
            const words = content.toLowerCase().split(/\s+/).length;
            const complexity = Math.min(10, Math.max(1, Math.floor(words / 100)));
            const requirements = (content.match(/requirement|must|should|need|require/gi) || []).length;
            const estimatedHours = Math.max(40, requirements * 15 + complexity * 20);
            const timelineWeeks = Math.ceil(estimatedHours / 40);
            const baseCost = estimatedHours * hourlyRate;
            const proposalAmount = baseCost * (1 + marginTarget / 100);

            return {
                success: true,
                requirements_found: requirements || 8,
                complexity_score: complexity,
                estimated_hours: estimatedHours,
                timeline_weeks: timelineWeeks,
                proposal_amount: proposalAmount,
                bid_decision: proposalAmount > 100000 ? 'REVIEW' : 'GO',
                confidence: proposalAmount > 100000 ? 'Medium' : 'High',
                phases: [
                    { name: 'Planning & Analysis', weeks: Math.ceil(timelineWeeks * 0.2) },
                    { name: 'Core Development', weeks: Math.ceil(timelineWeeks * 0.5) },
                    { name: 'Integration & Testing', weeks: Math.ceil(timelineWeeks * 0.2) },
                    { name: 'Deployment & Handover', weeks: Math.ceil(timelineWeeks * 0.1) }
                ]
            };
        }

        function displayResults(result) {
            const resultsGrid = document.getElementById('results-grid');
            const phasesList = document.getElementById('phases-list');

            // Clear previous results
            resultsGrid.innerHTML = '';
            phasesList.innerHTML = '';

            // Display main metrics
            const metrics = [
                { label: 'Requirements', value: result.requirements_found },
                { label: 'Complexity', value: `${result.complexity_score}/10` },
                { label: 'Est. Hours', value: result.estimated_hours },
                { label: 'Timeline', value: `${result.timeline_weeks} weeks` },
                { label: 'Proposal', value: `$${result.proposal_amount.toLocaleString()}` },
                { label: 'Decision', value: result.bid_decision }
            ];

            metrics.forEach(metric => {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <div class="label">${metric.label}</div>
                    <div class="value">${metric.value}</div>
                `;
                resultsGrid.appendChild(item);
            });

            // Display phases
            if (result.phases) {
                result.phases.forEach(phase => {
                    const phaseItem = document.createElement('div');
                    phaseItem.className = 'phase-item';
                    phaseItem.innerHTML = `
                        <span>${phase.name}</span>
                        <strong>${phase.weeks} weeks</strong>
                    `;
                    phasesList.appendChild(phaseItem);
                });
            }
        }

        // Initialize tooltips and animations on load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🎯 RFQ Analyzer loaded successfully');
        });
    </script>
</body>
</html>
